# good source: http://danielallendeutsch.com/blog/16-using-tmux-properly.html

set -g mouse on
# git doesn't like the default tmux-256color, so pretend we're in xterm. previously I used
# screen-256color but it doesn't have the same color depth or something, so some of delta's colors
# came out black. see the awk script commented out below for testing.
set -g default-term "xterm-256color"
# git-delta gets confused and wouldn't respect changes in the system theme for some reason, unless
# this override is present. note that it has to match the default-term specified above per
# https://github.com/tmux/tmux/issues/696#issuecomment-360629057
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-command "reattach-to-user-namespace -l zsh"
set -g set-titles on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 10000 # scrollback buffer
set -g prefix2 `
bind ` send-prefix -2

